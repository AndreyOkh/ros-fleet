<div class="modal-overlay" id="router-modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="modal-title">
        {{if .IsEdit}}Редактировать устройство {{.Router.Name}}{{else}}Добавить устройство в парк{{end}}
      </h3>
      <button class="close-btn" onclick="document.getElementById('modal-container').innerHTML = ''">&times;</button>
    </div>

    <form hx-post="/routers"
          hx-target="#routers-table-container"
          hx-swap="innerHTML"
          onsubmit="setTimeout(() => { document.getElementById('modal-container').innerHTML = ''; }, 300)">
      
      <div class="form-grid">
        <div class="form-group">
          <label for="name">Имя устройства *</label>
          <input type="text" id="name" name="name" value="{{.Router.Name}}" required
                 {{if .IsEdit}}readonly style="opacity: 0.7; cursor: not-allowed;"{{end}}
                 placeholder="Router-Core-1">
        </div>

        <div class="form-group">
          <label for="host">Хост (IP или DNS) *</label>
          <input type="text" id="host" name="host" value="{{.Router.Host}}" required placeholder="192.168.88.1">
        </div>

        <div class="form-group">
          <label for="port">SSH Порт (0 = из defaults: {{.Defaults.Port}})</label>
          <input type="number" id="port" name="port" value="{{if gt .Router.Port 0}}{{.Router.Port}}{{end}}" placeholder="{{.Defaults.Port}} (по умолчанию)">
        </div>

        <div class="form-group">
          <label for="user">SSH Пользователь</label>
          <input type="text" id="user" name="user" value="{{.Router.User}}" placeholder="{{if .Defaults.User}}{{.Defaults.User}} (из defaults){{else}}admin{{end}}">
        </div>

        <div class="form-group full-width">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" value="{{.Router.Password}}" placeholder="{{if .Defaults.Password}}•••••••• (задан в defaults){{else}}Оставьте пустым, если используется SSH-ключ{{end}}">
        </div>

        <div class="form-group">
          <label for="private_key_path">Путь к SSH-ключу</label>
          <input type="text" id="private_key_path" name="private_key_path" value="{{.Router.PrivateKeyPath}}" placeholder="{{if .Defaults.PrivateKeyPath}}{{.Defaults.PrivateKeyPath}} (из defaults){{else}}/root/.ssh/id_ed25519{{end}}">
        </div>

        <div class="form-group">
          <label for="private_key_passphrase">Пароль от SSH-ключа</label>
          <input type="password" id="private_key_passphrase" name="private_key_passphrase" value="{{.Router.PrivateKeyPassphrase}}" placeholder="Опционально">
        </div>

        <div class="form-group full-width">
          <label for="insecure_ignore_host_key">Проверка HostKey</label>
          <select id="insecure_ignore_host_key" name="insecure_ignore_host_key">
            <option value="inherit" {{if eq .Router.InsecureIgnoreHostKey nil}}selected{{end}}>
              По умолчанию из defaults ({{if .Defaults.InsecureIgnoreHostKey}}Отключена{{else}}Включена строгая{{end}})
            </option>
            <option value="true" {{if and .Router.InsecureIgnoreHostKey (derefBool .Router.InsecureIgnoreHostKey)}}selected{{end}}>
              Всегда отключать проверку HostKey (для LAN)
            </option>
            <option value="false" {{if and .Router.InsecureIgnoreHostKey (not (derefBool .Router.InsecureIgnoreHostKey))}}selected{{end}}>
              Строгая проверка HostKey через known_hosts
            </option>
          </select>
        </div>

        <div class="form-group full-width">
          <label for="export_sensitive">Чувствительные данные (.rsc / show-sensitive)</label>
          <select id="export_sensitive" name="export_sensitive">
            <option value="inherit" {{if eq .Router.ExportSensitive nil}}selected{{end}}>
              По умолчанию из defaults ({{if .Defaults.ExportSensitive}}Включать{{else}}Скрывать{{end}})
            </option>
            <option value="true" {{if and .Router.ExportSensitive (derefBool .Router.ExportSensitive)}}selected{{end}}>
              Всегда включать пароли и ключи в экспорт (show-sensitive)
            </option>
            <option value="false" {{if and .Router.ExportSensitive (not (derefBool .Router.ExportSensitive))}}selected{{end}}>
              Скрывать пароли в экспорте
            </option>
          </select>
        </div>

        <div class="form-group full-width">
          <label for="encrypt_backup">Шифрование бинарного бэкапа (.backup)</label>
          <select id="encrypt_backup" name="encrypt_backup"
                  onchange="document.getElementById('backup_pwd_group').style.display = (this.value === 'true' || (this.value === 'inherit' && {{.Defaults.EncryptBackup}})) ? 'block' : 'none'">
            <option value="inherit" {{if eq .Router.EncryptBackup nil}}selected{{end}}>
              По умолчанию из defaults ({{if .Defaults.EncryptBackup}}Шифровать{{else}}Без шифрования{{end}})
            </option>
            <option value="true" {{if and .Router.EncryptBackup (derefBool .Router.EncryptBackup)}}selected{{end}}>
              Всегда шифровать паролем
            </option>
            <option value="false" {{if and .Router.EncryptBackup (not (derefBool .Router.EncryptBackup))}}selected{{end}}>
              Не шифровать (dont-encrypt=yes)
            </option>
          </select>
        </div>

        <div class="form-group full-width" id="backup_pwd_group"
             style="display: {{if or (and .Router.EncryptBackup (derefBool .Router.EncryptBackup)) (and (eq .Router.EncryptBackup nil) .Defaults.EncryptBackup)}}block{{else}}none{{end}};">
          <label for="backup_password">Пароль шифрования бэкапа</label>
          <input type="password" id="backup_password" name="backup_password" value="{{.Router.BackupPassword}}"
                 placeholder="{{if .Defaults.BackupPassword}}•••••••• (задан в defaults){{else}}Стойкий пароль шифрования{{end}}">
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('modal-container').innerHTML = ''">
          Отмена
        </button>
        <button type="submit" class="btn btn-primary">
          {{if .IsEdit}}Сохранить изменения{{else}}Добавить устройство{{end}}
        </button>
      </div>
    </form>
  </div>
</div>
