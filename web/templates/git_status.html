<div class="git-status-badge {{if not .Enabled}}git-disabled{{else if .LastError}}git-error{{else}}git-ok{{end}}"
     title="{{if not .Enabled}}Git-версионирование экспортов отключено{{else if .LastError}}{{.LastError}}{{else}}Ветка: {{.Branch}} | Последний коммит: {{.LastCommitMsg}}{{end}}">
  <span class="git-icon">🌿</span>
  {{if not .Enabled}}
    <span class="git-text">Git: выкл</span>
  {{else}}
    <span class="git-branch">{{.Branch}}</span>
    {{if .LastCommitHash}}
      <span class="git-hash" title="{{.LastCommitMsg}}">#{{.LastCommitHash}}</span>
      <span class="git-time">{{.LastCommitFormatted}}</span>
    {{else}}
      <span class="git-time">нет коммитов</span>
    {{end}}
    {{if or .AutoPush .RemoteURL}}
      <button type="button"
              class="git-push-btn {{if .LastError}}push-error{{else if not .LastPushAt.IsZero}}push-ok{{else}}push-idle{{end}}"
              hx-post="/dashboard/git-push"
              hx-target="#git-status-container"
              hx-swap="innerHTML"
              hx-indicator="#git-push-indicator"
              title="{{if .LastError}}Ошибка отправки: {{.LastError}} (нажмите, чтобы повторить){{else if not .LastPushAt.IsZero}}Отправлено: {{.LastPushFormatted}} (нажмите для повторной отправки){{else}}Нажмите для отправки изменений в Git{{end}}">
        <span class="git-push-spinner htmx-indicator" id="git-push-indicator"></span>
        <span class="git-push-icon">{{if .LastError}}⚠️{{else}}⬆️{{end}}</span>
        <span class="git-push-text">{{if .LastError}}Push error{{else if not .LastPushAt.IsZero}}Push ok{{else}}Push{{end}}</span>
      </button>
    {{else}}
      <span class="git-pill-local" title="Локальный Git репозиторий (remote_url не задан)">💾 local</span>
    {{end}}
  {{end}}
</div>
