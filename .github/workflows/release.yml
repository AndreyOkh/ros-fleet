name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release-binaries:
    name: Build & Release Static Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build and Package Binaries
        id: build
        run: |
          VERSION="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          LDFLAGS="-s -w \
            -X github.com/AndreyOkh/ros-fleet/internal/version.Version=${VERSION} \
            -X github.com/AndreyOkh/ros-fleet/internal/version.Commit=${COMMIT} \
            -X github.com/AndreyOkh/ros-fleet/internal/version.BuildDate=${BUILD_DATE} \
            -X main.version=${VERSION} \
            -X main.commit=${COMMIT} \
            -X main.date=${BUILD_DATE}"

          mkdir -p dist

          for ARCH in amd64 arm64; do
            echo "Building static binary for linux/${ARCH}..."
            STAGING_DIR="build-linux-${ARCH}"
            mkdir -p "${STAGING_DIR}"
            CGO_ENABLED=0 GOOS=linux GOARCH=${ARCH} go build \
              -trimpath \
              -ldflags="${LDFLAGS}" \
              -o "${STAGING_DIR}/ros-fleet" \
              ./cmd/ros-fleet

            TAR_NAME="ros-fleet_${VERSION}_linux_${ARCH}.tar.gz"
            tar -czf "dist/${TAR_NAME}" -C "${STAGING_DIR}" ros-fleet
            rm -rf "${STAGING_DIR}"
          done

          cd dist
          sha256sum ros-fleet_*.tar.gz > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/ros-fleet_*.tar.gz
            dist/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-docker:
    name: Build & Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Build Date
        id: date
        run: echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/andreyokh/ros-fleet:latest
            ghcr.io/andreyokh/ros-fleet:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.date }}
