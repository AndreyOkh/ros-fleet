services:
  ros-fleet:
    build:
      context: .
      dockerfile: Dockerfile
    image: ros-fleet:latest
    container_name: ros-fleet
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.json:/app/config.json:rw
      - ./backups:/app/backups:rw
      - ~/.ssh:/home/rosfleet/.ssh:ro
    environment:
      - TZ=Europe/Moscow
    command: ["-config", "/app/config.json"]
