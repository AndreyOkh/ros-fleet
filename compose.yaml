services:
  ros-fleet:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/andreyokh/ros-fleet:latest
    container_name: ros-fleet
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.json:/app/config.json:rw
      - ./state.json:/app/state.json:rw
      - ./backups:/app/backups:rw
      # SSH keys and known_hosts for router connections and Git remote auto_push
#      - ~/.ssh/id_ed25519:/home/rosfleet/.ssh/id_ed25519:ro
#      - ~/.ssh/known_hosts:/home/rosfleet/.ssh/known_hosts:ro
    environment:
      - TZ=Europe/Moscow
      # Optional: UID/GID for file ownership alignment (defaults to 1000:1000)
      - PUID=1000
      - PGID=1000
    command: ["-config", "/app/config.json"]
